name: Build Duyzz Voice Bubble APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build app-debug.apk
        run: gradle assembleDebug --stacktrace

      - name: Verify APK output
        run: ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload app-debug.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: duyzz-voice-bubble-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
